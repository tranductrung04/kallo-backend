openapi: 3.1.0

info:
  title: Kallo Backend — AUTH API
  version: 0.1.0-draft
  summary: Hợp đồng API cho module AUTH (xác thực, tài khoản) của Kallo Backend.
  description: |
    Bản nháp OpenAPI dựng từ `IMPLEMENT_MODULE_AUTH.md` (mục "Hợp đồng API", Phase 0–6) và
    `REQUIREMENT.md` (SRS 1.2, FR-AUTH-01…09). Đây là **hợp đồng thiết kế**, chưa đối chiếu với mã
    nguồn thực tế; khi `springdoc` sinh `/v3/api-docs`, hãy so sánh hai bản và sửa chỗ lệch.

    ## Quy ước chung
    - Tiền tố đường dẫn `/api`. Mọi phản hồi (trừ 204) theo `ApiResponse`:
      `{ "success": true, "data": ..., "error": null }` hoặc
      `{ "success": false, "data": null, "error": { "code", "message", "details" } }` (quyết định D9).
    - Mobile xử lý lỗi theo `error.code` (chuỗi cố định), không theo `error.message`.
    - Lỗi không lường trước trả 500 và không lộ stacktrace.
    - Xác thực: `Authorization: Bearer <access token>`. Chỉ `change-password`, `verify-email`,
      `resend-verification` trong nhóm `auth` cần Bearer; các endpoint `auth` còn lại công khai.

    ## Token
    - **Access token**: JWT HS256, sống 15 phút (`expiresIn` = 900 giây). Claim: `sub` (user id), `role`,
      `email_verified`, `jti`, `iat`, `exp`.
    - **Refresh token**: chuỗi ngẫu nhiên 32 byte (base64url), sống 7 ngày, xoay vòng mỗi lần
      `refresh`. Dùng lại token đã thu hồi sẽ thu hồi cả họ token (`family_id`).

    ## Xác minh email bắt buộc (FR-AUTH-09, D10)
    Tài khoản `emailVerified = false` vẫn đăng nhập và nhận token, nhưng mọi API nghiệp vụ trả
    **403 `EMAIL_NOT_VERIFIED`**. Ngoại lệ: nhóm `/api/auth/**` và `GET /api/users/me`. Sau
    `verify-email`, dùng access token mới do endpoint đó trả về.

    ## Giới hạn tần suất
    Phase 5 giới hạn gửi lại mã theo user/email và trả 429 khi xác định được user; header `Retry-After`
    sẽ được bổ sung trong Phase 7. Giới hạn theo IP (bao gồm forgot-password với email không tồn tại)
    cũng thuộc Phase 7.
  contact:
    name: Nhóm Kallo
  license:
    name: Nội bộ
    identifier: UNLICENSED

servers:
  - url: http://localhost:8080
    description: Môi trường dev (cổng giả định, sửa theo `server.port`)

tags:
  - name: auth
    description: Đăng ký, đăng nhập, làm mới token, quên/đổi mật khẩu, xác minh email, Google.
  - name: users
    description: Tài khoản của người dùng hiện tại (`/users/me`). User id luôn lấy từ token, không nhận từ client.

security:
  - bearerAuth: []

paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Đăng ký bằng email và mật khẩu
      description: |
        FR-AUTH-01. Email được chuẩn hoá (trim, chữ thường). Trả luôn cặp token để gọi được API xác minh
        email. Sau khi giao dịch commit, hệ thống gửi OTP xác minh qua email (lỗi gửi chỉ ghi log,
        không làm đăng ký thất bại). Tài khoản mới có `emailVerified = false`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: an.nguyen@example.com
              password: Matkhau123
              displayName: Nguyễn Văn An
      responses:
        '201':
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiResponse'
              example:
                success: true
                data:
                  accessToken: eyJhbGciOiJIUzI1NiJ9...
                  refreshToken: 3q2-7wAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  tokenType: Bearer
                  expiresIn: 900
                  user:
                    id: 7b9d6a52-2f6e-4d0e-9a53-0e1c3b1a8f10
                    email: an.nguyen@example.com
                    displayName: Nguyễn Văn An
                    avatarUrl: null
                    role: USER
                    emailVerified: false
                    timezone: Asia/Ho_Chi_Minh
                  profileCompleted: false
                  emailVerified: false
                error: null
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email đã có tài khoản (`EMAIL_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: EMAIL_ALREADY_EXISTS
                  message: Email này đã được đăng ký.
                  details: []
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Đăng nhập bằng email và mật khẩu
      description: |
        FR-AUTH-02. Email không tồn tại, sai mật khẩu và tài khoản chỉ dùng Google đều trả cùng một lỗi
        `INVALID_CREDENTIALS`. Khoá tạm sau 5 lần sai trong 15 phút theo cặp email + IP (429).
        Tài khoản chưa xác minh email vẫn đăng nhập được (`emailVerified = false`); mobile cần chuyển tới màn nhập mã.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: an.nguyen@example.com
              password: Matkhau123
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Sai thông tin đăng nhập (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: INVALID_CREDENTIALS
                  message: Email hoặc mật khẩu không đúng.
                  details: []
        '403':
          description: Tài khoản bị khoá (`ACCOUNT_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: ACCOUNT_DISABLED
                  message: Tài khoản đã bị vô hiệu hoá.
                  details: []
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Làm mới cặp token
      description: |
        FR-AUTH-06. Thu hồi refresh token cũ và cấp cặp mới cùng `family_id`. Token không có, hết hạn hoặc
        đã bị thu hồi trả 401 `REFRESH_TOKEN_INVALID`. Dùng lại token đã thu hồi (ngoài cửa sổ ân hạn
        `JWT_REFRESH_REUSE_GRACE`) sẽ thu hồi cả họ token. Mobile nên gộp các lần refresh đồng thời thành một
        lần gọi và không xoá phiên chỉ vì một 401 đơn lẻ ngay sau khi refresh thành công.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Cặp token mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Refresh token không hợp lệ (`REFRESH_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: REFRESH_TOKEN_INVALID
                  message: Phiên đăng nhập không còn hiệu lực.
                  details: []

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Đăng xuất
      description: |
        FR-AUTH-06. Thu hồi refresh token được gửi lên, hoặc mọi refresh token của user khi
        `allDevices = true`. Luôn trả 204 (idempotent), kể cả khi token không tồn tại hoặc client không gửi
        refresh token. Không cần access token còn hạn.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Đã đăng xuất. Không có nội dung.

  /api/auth/change-password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Đổi mật khẩu khi đã đăng nhập
      description: |
        FR-AUTH-05. Cần Bearer. Mật khẩu mới theo cùng quy tắc với đăng ký và phải khác mật khẩu cũ.
        Thành công thì thu hồi mọi refresh token (các phiên khác bị đăng xuất) và cấp cặp token mới cho
        thiết bị đang dùng. Tài khoản chỉ dùng Google (chưa có mật khẩu) nhận 400 `PASSWORD_NOT_SET` và
        nên đặt mật khẩu qua `forgot-password`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Đổi mật khẩu thành công, trả cặp token mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairApiResponse'
        '400':
          description: Dữ liệu sai, mật khẩu hiện tại sai, hoặc tài khoản chưa có mật khẩu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Lỗi validate
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu không hợp lệ.
                      details:
                        - field: newPassword
                          message: Mật khẩu phải có ít nhất 8 ký tự gồm cả chữ và số.
                invalidCurrent:
                  summary: Mật khẩu hiện tại sai
                  value:
                    success: false
                    data: null
                    error:
                      code: INVALID_CURRENT_PASSWORD
                      message: Mật khẩu hiện tại không đúng.
                      details: []
                passwordNotSet:
                  summary: Tài khoản chỉ dùng Google
                  value:
                    success: false
                    data: null
                    error:
                      code: PASSWORD_NOT_SET
                      message: Tài khoản chưa có mật khẩu.
                      details: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/google:
    post:
      tags: [auth]
      operationId: loginWithGoogle
      summary: Đăng nhập hoặc đăng ký bằng Google
      description: |
        FR-AUTH-03. App gửi **Google ID token**; server xác minh chữ ký bằng JWKS của Google, `iss`
        (`accounts.google.com` hoặc `https://accounts.google.com`), `aud` thuộc danh sách client ID cấu hình,
        thời hạn, và `email_verified = true`.

        Thứ tự xử lý: (1) có `google_sub` → đăng nhập; (2) email đã tồn tại → liên kết (ghi `google_sub`, đặt
        `email_verified = true`; nếu tài khoản email chưa xác minh thì xoá mật khẩu cũ và thu hồi mọi refresh
        token); (3) chưa có gì → tạo tài khoản mới, `isNewUser = true`. Mobile dựa vào `isNewUser` và
        `profileCompleted` để chuyển sang màn thiết lập hồ sơ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: ID token không hợp lệ (`GOOGLE_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: GOOGLE_TOKEN_INVALID
                  message: Không xác minh được tài khoản Google.
                  details: []

  /api/auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Yêu cầu mã OTP đặt lại mật khẩu
      description: |
        FR-AUTH-04. Nếu email tồn tại, gửi OTP 6 chữ số (hạn 15 phút). **Luôn trả 200** dù email có tồn tại
        hay không, để không lộ email nào đã đăng ký. Phase 5 giới hạn 3 mã/giờ/email và khoảng cách 60 giây;
        khi vượt giới hạn hệ thống vẫn trả 200 và không gửi thư mới. Giới hạn 10 yêu cầu/giờ/IP thuộc Phase 7.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Đã tiếp nhận yêu cầu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'

  /api/auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Đặt lại mật khẩu bằng OTP
      description: |
        FR-AUTH-04. Mã sai, hết hạn hoặc đã dùng đều trả cùng `RESET_CODE_INVALID`; sai quá 5 lần thì mã bị
        vô hiệu. Thành công thì đổi mật khẩu, thu hồi mọi refresh token và đặt `email_verified = true`.
        Tài khoản tạo bằng Google sau khi đặt lại sẽ đăng nhập được cả hai cách.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Đặt lại mật khẩu thành công. Không có nội dung.
        '400':
          description: Dữ liệu sai hoặc mã OTP không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Lỗi validate
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu không hợp lệ.
                      details:
                        - field: code
                          message: Mã gồm đúng 6 chữ số.
                invalidCode:
                  summary: Mã sai, hết hạn hoặc đã dùng
                  value:
                    success: false
                    data: null
                    error:
                      code: RESET_CODE_INVALID
                      message: Mã không hợp lệ hoặc đã hết hạn.
                      details: []

  /api/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Xác minh email bằng OTP
      description: |
        FR-AUTH-09. Cần Bearer; chỉ tác động lên user trong token, không nhận email hay id từ client.
        Mã đúng thì đặt `email_verified = true` và trả **access token mới** có claim `email_verified = true`
        (refresh token giữ nguyên). Nếu email đã xác minh từ trước thì bỏ qua bước kiểm mã và vẫn trả 200.
        Mã sai, hết hạn, đã bị mã mới thay hoặc đã bị khoá (sai quá 5 lần) đều trả `VERIFICATION_CODE_INVALID`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              code: '123456'
      responses:
        '200':
          description: Xác minh thành công, trả access token mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenApiResponse'
        '400':
          description: Dữ liệu sai hoặc mã không hợp lệ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validation:
                  summary: Lỗi validate
                  value:
                    success: false
                    data: null
                    error:
                      code: VALIDATION_ERROR
                      message: Dữ liệu không hợp lệ.
                      details:
                        - field: code
                          message: Mã gồm đúng 6 chữ số.
                invalidCode:
                  summary: Mã sai, hết hạn, bị thay hoặc bị khoá
                  value:
                    success: false
                    data: null
                    error:
                      code: VERIFICATION_CODE_INVALID
                      message: Mã xác minh không hợp lệ hoặc đã hết hạn.
                      details: []
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Gửi lại mã OTP xác minh email
      description: |
        FR-AUTH-09. Cần Bearer, không có body. Mã cũ chưa dùng bị vô hiệu. Giới hạn: cách nhau ≥ 60 giây,
        tối đa 3 mã/giờ/user; vượt thì 429 (chưa có `Retry-After`, sẽ bổ sung ở Phase 7). Giới hạn
        10 yêu cầu/giờ/IP thuộc Phase 7. Email đã xác minh thì 409
        `EMAIL_ALREADY_VERIFIED`.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Đã gửi lại mã. Không có nội dung.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email đã được xác minh (`EMAIL_ALREADY_VERIFIED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: EMAIL_ALREADY_VERIFIED
                  message: Email đã được xác minh.
                  details: []
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/users/me:
    get:
      tags: [users]
      operationId: getMe
      summary: Xem thông tin tài khoản hiện tại
      description: |
        FR-AUTH-08. Được phép gọi cả khi `emailVerified = false` (để mobile đọc trạng thái xác minh).
        Thông tin hồ sơ sức khoẻ (`GET /api/users/me/profile`) thuộc module PROFILE, không nằm trong spec này.
      responses:
        '200':
          description: Thông tin tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [users]
      operationId: updateMe
      summary: Cập nhật tên hiển thị và múi giờ
      description: |
        FR-AUTH-08. `timezone` phải thuộc danh sách múi giờ IANA mà Java hỗ trợ (`ZoneId.getAvailableZoneIds()`).
        Yêu cầu email đã xác minh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              displayName: Nguyễn Văn An
              timezone: Asia/Ho_Chi_Minh
      responses:
        '200':
          description: Thông tin đã cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserApiResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
    delete:
      tags: [users]
      operationId: deleteMe
      summary: Xoá tài khoản và toàn bộ dữ liệu
      description: |
        FR-AUTH-07 (mức S). Yêu cầu xác nhận lại bằng `password`, hoặc `idToken` Google mới với tài khoản không có
        mật khẩu. Xoá ảnh trên object storage rồi xoá dòng `users`; dữ liệu mọi module bị dọn theo
        `ON DELETE CASCADE`. Thao tác không hoàn tác được. Yêu cầu email đã xác minh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Đã xoá tài khoản. Không có nội dung.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Thiếu access token, hoặc xác nhận (mật khẩu / Google ID token) sai.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/EmailNotVerified'

  /api/users/me/avatar:
    post:
      tags: [users]
      operationId: uploadAvatar
      summary: Tải ảnh đại diện
      description: |
        FR-AUTH-08. Chỉ JPEG hoặc PNG, tối đa 2 MB. Loại tệp được kiểm tra theo **nội dung**, không tin đuôi tệp hay
        `Content-Type`. Ảnh cũ bị xoá. Trả URL ký có thời hạn. Yêu cầu email đã xác minh.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Ảnh JPEG hoặc PNG, tối đa 2 MB.
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Tải lên thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarApiResponse'
        '400':
          description: Tệp sai định dạng hoặc thiếu (`INVALID_FILE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: INVALID_FILE
                  message: Chỉ chấp nhận ảnh JPEG hoặc PNG.
                  details: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '413':
          description: Tệp vượt quá 2 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                data: null
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: Ảnh vượt quá dung lượng tối đa 2 MB.
                  details: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT lấy từ `register`, `login`, `google`, `refresh` hoặc `change-password`.

  headers:
    RetryAfter:
      description: Số giây cần chờ trước khi gọi lại.
      schema:
        type: integer
        minimum: 1
        examples: [60]

  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ (`VALIDATION_ERROR`); `details` liệt kê theo từng trường.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu không hợp lệ.
              details:
                - field: password
                  message: Mật khẩu phải có ít nhất 8 ký tự gồm cả chữ và số.
    Unauthorized:
      description: Thiếu, sai chữ ký, bị sửa claim hoặc hết hạn access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: UNAUTHORIZED
              message: Chưa xác thực hoặc phiên đã hết hạn.
              details: []
    EmailNotVerified:
      description: Email chưa xác minh (`EMAIL_NOT_VERIFIED`). Mobile chuyển về màn nhập mã OTP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: EMAIL_NOT_VERIFIED
              message: Vui lòng xác minh email trước khi tiếp tục.
              details: []
    TooManyRequests:
      description: Vượt giới hạn tần suất (`TOO_MANY_REQUESTS`).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            data: null
            error:
              code: TOO_MANY_REQUESTS
              message: Bạn thao tác quá nhanh, vui lòng thử lại sau.
              details: []

  schemas:
    # ---------- Request ----------
    Email:
      type: string
      format: email
      maxLength: 255
      description: Được chuẩn hoá phía server (trim, chữ thường).
      examples: [an.nguyen@example.com]

    Password:
      type: string
      minLength: 8
      pattern: '^(?=.*[A-Za-z])(?=.*[0-9]).{8,}$'
      description: Tối thiểu 8 ký tự, gồm cả chữ và số (SRS §4.1).
      examples: [Matkhau123]

    OtpCode:
      type: string
      pattern: '^[0-9]{6}$'
      description: Mã OTP gồm đúng 6 chữ số.
      examples: ['123456']

    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token cần thu hồi. Có thể bỏ trống.
        allDevices:
          type: boolean
          default: false
          description: "`true` thì thu hồi mọi refresh token của user."

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          allOf:
            - $ref: '#/components/schemas/Password'
          description: Theo cùng quy tắc mật khẩu và phải khác mật khẩu hiện tại.

    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google ID token lấy từ app mobile.

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    ResetPasswordRequest:
      type: object
      required: [email, code, newPassword]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          $ref: '#/components/schemas/OtpCode'
        newPassword:
          $ref: '#/components/schemas/Password'

    VerifyEmailRequest:
      type: object
      required: [code]
      properties:
        code:
          $ref: '#/components/schemas/OtpCode'

    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        timezone:
          type: string
          description: Múi giờ IANA.
          examples: [Asia/Ho_Chi_Minh]

    DeleteAccountRequest:
      type: object
      description: Cần `password` (tài khoản có mật khẩu) hoặc `idToken` (tài khoản Google không có mật khẩu).
      properties:
        password:
          type: string
        idToken:
          type: string
          description: Google ID token mới.
      oneOf:
        - required: [password]
        - required: [idToken]

    # ---------- Domain ----------
    UserSummary:
      type: object
      required: [id, email, displayName, role, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: URL ký có thời hạn; `null` nếu chưa có ảnh.
        role:
          type: string
          enum: [USER, ADMIN]
        emailVerified:
          type: boolean
        timezone:
          type: string
          examples: [Asia/Ho_Chi_Minh]

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT HS256, sống 15 phút.
        refreshToken:
          type: string
          description: Chuỗi ngẫu nhiên, sống 7 ngày, dùng một lần (xoay vòng).
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: Thời gian sống của access token, tính bằng giây.
          examples: [900]

    AuthResponse:
      description: Cặp token cùng thông tin người dùng, trả về sau đăng ký hoặc đăng nhập.
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [user, profileCompleted, emailVerified]
          properties:
            user:
              $ref: '#/components/schemas/UserSummary'
            profileCompleted:
              type: boolean
              description: Hồ sơ sức khoẻ đã hoàn tất (do module PROFILE cung cấp; tạm thời luôn `false`).
            emailVerified:
              type: boolean

    GoogleAuthResponse:
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          required: [isNewUser]
          properties:
            isNewUser:
              type: boolean
              description: "`true` nếu tài khoản vừa được tạo từ Google."

    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          examples: [900]

    AvatarResponse:
      type: object
      required: [avatarUrl]
      properties:
        avatarUrl:
          type: string
          format: uri
          description: URL ký có thời hạn.

    # ---------- Envelope ----------
    ApiResponseBase:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
        error:
          type: 'null'

    AuthApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AuthResponse'

    GoogleAuthApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/GoogleAuthResponse'

    TokenPairApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'

    AccessTokenApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AccessTokenResponse'

    UserApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/UserSummary'

    AvatarApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/AvatarResponse'

    EmptyApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseBase'
        - type: object
          properties:
            data:
              type: 'null'

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Câu chữ cho người đọc; có thể đổi, không dùng để rẽ nhánh logic.
        details:
          type: array
          description: Lỗi theo từng trường (chỉ có với `VALIDATION_ERROR`).
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          examples: [password]
        message:
          type: string

    ErrorCode:
      type: string
      description: |
        Mã lỗi cố định để mobile xử lý. Tài liệu nguồn không nêu mã cho ba trường hợp: thiếu/sai access
        token (401), ảnh quá 2 MB (413) và lỗi 500. Ba mã `UNAUTHORIZED`, `PAYLOAD_TOO_LARGE`,
        `INTERNAL_ERROR` là tên suy luận; cần đối chiếu với enum `ErrorCode` khi cài đặt.
      enum:
        - VALIDATION_ERROR
        - EMAIL_ALREADY_EXISTS
        - INVALID_CREDENTIALS
        - ACCOUNT_DISABLED
        - TOO_MANY_REQUESTS
        - REFRESH_TOKEN_INVALID
        - INVALID_CURRENT_PASSWORD
        - PASSWORD_NOT_SET
        - GOOGLE_TOKEN_INVALID
        - RESET_CODE_INVALID
        - VERIFICATION_CODE_INVALID
        - EMAIL_ALREADY_VERIFIED
        - EMAIL_NOT_VERIFIED
        - INVALID_FILE
        - UNAUTHORIZED
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR

services:
  postgres:
    image: postgres:17-alpine
    container_name: ${APP_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: ${APP_NAME}-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: ${APP_NAME}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: ${APP_NAME}-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: ${APP_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: ${DB_URL}
      PROD_DB_USERNAME: ${DB_USERNAME}
      PROD_DB_PASSWORD: ${DB_PASSWORD}
      PROD_REDIS_HOST: redis
      PROD_REDIS_PORT: 6379
      PROD_ES_URIS: http://elasticsearch:9200
      PROD_SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      JWT_REFRESH_REUSE_GRACE: ${JWT_REFRESH_REUSE_GRACE:-3000}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-}
      APP_NOTIFICATION_RETENTION_DAYS: ${APP_NOTIFICATION_RETENTION_DAYS:-30}
      APP_NOTIFICATION_REMINDER_DAILY_CAP: ${APP_NOTIFICATION_REMINDER_DAILY_CAP:-6}
      APP_NOTIFICATION_MAX_DEVICES_PER_USER: ${APP_NOTIFICATION_MAX_DEVICES_PER_USER:-10}
      APP_NOTIFICATION_REMINDER_CATCH_UP: ${APP_NOTIFICATION_REMINDER_CATCH_UP:-10m}
      APP_SYNC_MAX_OPERATIONS: ${APP_SYNC_MAX_OPERATIONS:-200}
      APP_SYNC_SETTLE_DELAY: ${APP_SYNC_SETTLE_DELAY:-2s}
      APP_SYNC_TOMBSTONE_RETENTION: ${APP_SYNC_TOMBSTONE_RETENTION:-30d}
      APP_SYNC_DEFAULT_PAGE: ${APP_SYNC_DEFAULT_PAGE:-500}
      APP_SYNC_MAX_PAGE: ${APP_SYNC_MAX_PAGE:-1000}
      APP_SYNC_MAX_FUTURE_SKEW: ${APP_SYNC_MAX_FUTURE_SKEW:-5m}
      APP_ATTRIBUTION_OFF_URL: ${APP_ATTRIBUTION_OFF_URL:-https://world.openfoodfacts.org}
      APP_ATTRIBUTION_OFF_LICENSE: ${APP_ATTRIBUTION_OFF_LICENSE:-ODbL-1.0}
      APP_ATTRIBUTION_OFF_TEXT: ${APP_ATTRIBUTION_OFF_TEXT:-Data from Open Food Facts, licensed under the Open Database License (ODbL).}
      APP_ATTRIBUTION_NIN_URL: ${APP_ATTRIBUTION_NIN_URL:-https://viendinhduong.vn/}
      APP_ATTRIBUTION_NIN_LICENSE: ${APP_ATTRIBUTION_NIN_LICENSE:-Vietnamese Food Composition Table terms}
      APP_ATTRIBUTION_NIN_TEXT: ${APP_ATTRIBUTION_NIN_TEXT:-Dữ liệu từ Viện Dinh dưỡng Quốc gia / Data from the Vietnam National Institute of Nutrition.}
      APP_ATTRIBUTION_FAO_INFOODS_URL: ${APP_ATTRIBUTION_FAO_INFOODS_URL:-https://www.fao.org/infoods}
      APP_ATTRIBUTION_FAO_INFOODS_LICENSE: ${APP_ATTRIBUTION_FAO_INFOODS_LICENSE:-FAO/INFOODS terms of use}
      APP_ATTRIBUTION_FAO_INFOODS_TEXT: ${APP_ATTRIBUTION_FAO_INFOODS_TEXT:-Dữ liệu từ FAO/INFOODS / Data from FAO/INFOODS.}
      APP_AUTH_MAX_LOGIN_ATTEMPTS: ${APP_AUTH_MAX_LOGIN_ATTEMPTS:-5}
      APP_AUTH_LOCK_DURATION: ${APP_AUTH_LOCK_DURATION:-15m}
      APP_AUTH_OTP_EXPIRATION: ${APP_AUTH_OTP_EXPIRATION:-15m}
      APP_AUTH_MAX_OTP_ATTEMPTS: ${APP_AUTH_MAX_OTP_ATTEMPTS:-5}
      APP_AUTH_RESEND_INTERVAL: ${APP_AUTH_RESEND_INTERVAL:-60s}
      APP_AUTH_MAX_OTP_PER_HOUR: ${APP_AUTH_MAX_OTP_PER_HOUR:-3}
      APP_ACT_MAX_SYNC_BATCH_SIZE: ${APP_ACT_MAX_SYNC_BATCH_SIZE:-500}
      APP_ACT_SYNC_BACKFILL_DAYS: ${APP_ACT_SYNC_BACKFILL_DAYS:-30}
      APP_ACT_MANUAL_BACKFILL_DAYS: ${APP_ACT_MANUAL_BACKFILL_DAYS:-365}
      APP_ACT_FUTURE_TOLERANCE: ${APP_ACT_FUTURE_TOLERANCE:-5m}
      APP_ACT_WEIGHT_MIN_KG: ${APP_ACT_WEIGHT_MIN_KG:-20}
      APP_ACT_WEIGHT_MAX_KG: ${APP_ACT_WEIGHT_MAX_KG:-300}
      APP_ACT_WALKING_MET: ${APP_ACT_WALKING_MET:-3.5}
      APP_ACT_WALKING_SPEED_KMH: ${APP_ACT_WALKING_SPEED_KMH:-5}
      APP_ACT_STRIDE_FACTOR: ${APP_ACT_STRIDE_FACTOR:-0.415}
      APP_ACT_FALLBACK_CADENCE_SPM: ${APP_ACT_FALLBACK_CADENCE_SPM:-100}
      APP_ACT_DEDUP_OVERLAP_RATIO: ${APP_ACT_DEDUP_OVERLAP_RATIO:-0.8}
      APP_ACT_TOMBSTONE_RETENTION: ${APP_ACT_TOMBSTONE_RETENTION:-90d}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      GOOGLE_JWKS_URI: ${GOOGLE_JWKS_URI}
      MAIL_HOST: mailpit
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: false
      MAIL_SMTP_STARTTLS_REQUIRED: false
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:
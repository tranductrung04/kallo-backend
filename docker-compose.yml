services:
  postgres:
    image: postgres:17-alpine
    container_name: ${APP_NAME}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: ${APP_NAME}-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: ${APP_NAME}-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: ${APP_NAME}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PROD_DB_URL: ${DB_URL}
      PROD_DB_USERNAME: ${DB_USERNAME}
      PROD_DB_PASSWORD: ${DB_PASSWORD}
      PROD_REDIS_HOST: redis
      PROD_REDIS_PORT: 6379
      PROD_ES_URIS: http://elasticsearch:9200
      PROD_SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      JWT_REFRESH_REUSE_GRACE: ${JWT_REFRESH_REUSE_GRACE:-3000}
      APP_AUTH_MAX_LOGIN_ATTEMPTS: ${APP_AUTH_MAX_LOGIN_ATTEMPTS:-5}
      APP_AUTH_LOCK_DURATION: ${APP_AUTH_LOCK_DURATION:-15m}
      APP_AUTH_OTP_EXPIRATION: ${APP_AUTH_OTP_EXPIRATION:-15m}
      APP_AUTH_MAX_OTP_ATTEMPTS: ${APP_AUTH_MAX_OTP_ATTEMPTS:-5}
      APP_AUTH_RESEND_INTERVAL: ${APP_AUTH_RESEND_INTERVAL:-60s}
      APP_AUTH_MAX_OTP_PER_HOUR: ${APP_AUTH_MAX_OTP_PER_HOUR:-3}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      GOOGLE_JWKS_URI: ${GOOGLE_JWKS_URI:-https://www.googleapis.com/oauth2/v3/certs}
      MAIL_HOST: mailpit
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: false
      MAIL_SMTP_STARTTLS_REQUIRED: false
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  es_data:
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  elasticsearch:
    uris: http://localhost:9200

logging:
  level:
    org.hibernate.SQL: debug
spring:
  flyway:
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/${DB_NAME}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: ${DEV_REDIS_TIMEOUT:500ms}
      connect-timeout: ${DEV_REDIS_CONNECT_TIMEOUT:500ms}
  elasticsearch:
    uris: http://localhost:9200
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{request_id:-}] %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: debug
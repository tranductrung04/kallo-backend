spring:
  application:
    name: '@projectName@'
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:3000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

app:
  otp-hmac-secret: ${OTP_HMAC_SECRET}
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    refresh-reuse-grace: ${JWT_REFRESH_REUSE_GRACE:3000}
  auth:
    max-login-attempts: ${APP_AUTH_MAX_LOGIN_ATTEMPTS:5}
    lock-duration: ${APP_AUTH_LOCK_DURATION:15m}
    otp-expiration: ${APP_AUTH_OTP_EXPIRATION:15m}
    max-otp-attempts: ${APP_AUTH_MAX_OTP_ATTEMPTS:5}
    resend-interval: ${APP_AUTH_RESEND_INTERVAL:60s}
    max-otp-per-hour: ${APP_AUTH_MAX_OTP_PER_HOUR:3}
  act:
    max-sync-batch-size: ${APP_ACT_MAX_SYNC_BATCH_SIZE:500}
    sync-backfill-days: ${APP_ACT_SYNC_BACKFILL_DAYS:30}
    manual-backfill-days: ${APP_ACT_MANUAL_BACKFILL_DAYS:365}
    future-tolerance: ${APP_ACT_FUTURE_TOLERANCE:5m}
    weight-min-kg: ${APP_ACT_WEIGHT_MIN_KG:20}
    weight-max-kg: ${APP_ACT_WEIGHT_MAX_KG:300}
    walking-met: ${APP_ACT_WALKING_MET:3.5}
    walking-speed-kmh: ${APP_ACT_WALKING_SPEED_KMH:5}
    stride-factor: ${APP_ACT_STRIDE_FACTOR:0.415}
    fallback-cadence-spm: ${APP_ACT_FALLBACK_CADENCE_SPM:100}
    dedup-overlap-ratio: ${APP_ACT_DEDUP_OVERLAP_RATIO:0.8}
    tombstone-retention: ${APP_ACT_TOMBSTONE_RETENTION:90d}
  google:
    client-ids: ${GOOGLE_CLIENT_ID}
    jwks-uri: ${GOOGLE_JWKS_URI}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    bucket: ${STORAGE_BUCKET}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
    presigned-url-expiration: ${STORAGE_PRESIGNED_URL_EXPIRATION:15m}
